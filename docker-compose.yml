services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-NovaWallet_Local_Only!2026}
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - ledger-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__NovaWallet: "Server=sqlserver;Database=NovaWallet;User Id=sa;Password=${MSSQL_SA_PASSWORD:-NovaWallet_Local_Only!2026};Encrypt=true;TrustServerCertificate=true"
      Jwt__Issuer: ${JWT_ISSUER:-NovaWallet.Local}
      Jwt__Audience: ${JWT_AUDIENCE:-NovaWallet.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-NovaWallet-Development-Only-Key-Change-Before-Production-2026}
      WalletOptions__DailyOutboundLimitKobo: ${DAILY_OUTBOUND_LIMIT_KOBO:-50000000}
      Database__ApplyMigrations: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
volumes:
  ledger-data:
